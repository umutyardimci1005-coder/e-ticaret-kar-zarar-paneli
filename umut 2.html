<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Ticaret Kâr/Zarar Paneli</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b1020;color:#eef2ff}
header{padding:22px 18px;background:#111936;border-bottom:1px solid #27345e}h1{margin:0;font-size:22px}.sub{color:#aeb9da;margin-top:5px}
main{max-width:1100px;margin:auto;padding:18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.box{background:#121a31;border:1px solid #27345e;border-radius:16px;padding:16px}
.card b{display:block;font-size:22px;margin-top:6px}.muted{color:#9eabd0}.profit{color:#6ee7a8}.loss{color:#ff8b8b}
.box{margin-top:14px}label{display:block;font-size:13px;color:#b8c2df;margin:8px 0 5px}input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #33436f;background:#0d1428;color:white}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{border:0;border-radius:10px;padding:12px 16px;background:#6d5dfc;color:white;font-weight:700;cursor:pointer;margin-top:12px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid #263354}th{color:#aeb9da}.scroll{overflow:auto}
.platforms{display:flex;gap:7px;flex-wrap:wrap}.tag{padding:7px 10px;border:1px solid #34446e;border-radius:999px;color:#cbd5f4;font-size:12px}
@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr 1fr}main{padding:12px}}
@media(max-width:430px){.cards,.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>📊 E-Ticaret Kâr / Zarar Paneli</h1><div class="sub">Pazaryeri bazlı gerçek kârlılık takibi</div></header>
<main>
<div class="platforms" id="platforms"></div>
<div class="cards">
<div class="card"><span class="muted">Toplam Ciro</span><b id="revenue">₺0</b></div>
<div class="card"><span class="muted">Toplam Maliyet</span><b id="cost">₺0</b></div>
<div class="card"><span class="muted">Kesintiler</span><b id="fees">₺0</b></div>
<div class="card"><span class="muted">Net Kâr</span><b id="profit">₺0</b></div>
</div>

<div class="box">
<h3>Satış Ekle</h3>
<div class="form">
<div><label>Platform</label><select id="platform"></select></div>
<div><label>Ürün / SKU</label><input id="sku" placeholder="Örn. MOVE-7"></div>
<div><label>Satış fiyatı (₺)</label><input id="sale" type="number" step="0.01"></div>
<div><label>Ürün maliyeti (₺)</label><input id="productCost" type="number" step="0.01"></div>
<div><label>Komisyon (%)</label><input id="commission" type="number" step="0.01"></div>
<div><label>Kargo (₺)</label><input id="shipping" type="number" step="0.01"></div>
<div><label>Hizmet/işlem bedeli (₺)</label><input id="service" type="number" step="0.01"></div>
<div><label>Stopaj (%)</label><input id="withholding" type="number" step="0.01" value="1"></div>
</div>
<button onclick="addSale()">Satışı Hesapla ve Ekle</button>
</div>

<div class="box"><h3>Satışlar</h3><div class="scroll"><table>
<thead><tr><th>Platform</th><th>SKU</th><th>Satış</th><th>Maliyet</th><th>Kesinti</th><th>Net Kâr</th><th></th></tr></thead>
<tbody id="rows"></tbody></table></div></div>
</main>
<script>
const names=["Trendyol","Ticimax","Hepsiburada","FLO","LCW","Temu","Pazarama","İdefix","DeFactoFit"];
const platform=document.getElementById("platform");
names.forEach(n=>{platform.add(new Option(n,n));document.getElementById("platforms").innerHTML+=`<span class="tag">${n}</span>`});
let sales=JSON.parse(localStorage.getItem("sales")||"[]");
const tl=n=>new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY"}).format(n||0);
function val(id){return Number(document.getElementById(id).value)||0}
function addSale(){
 const sale=val("sale"), cost=val("productCost"), com=sale*val("commission")/100, ship=val("shipping"), serv=val("service"), stop=sale*val("withholding")/100;
 const fees=com+ship+serv+stop, profit=sale-cost-fees;
 sales.unshift({platform:platform.value,sku:document.getElementById("sku").value||"-",sale,cost,fees,profit});
 localStorage.setItem("sales",JSON.stringify(sales)); render();
}
function del(i){sales.splice(i,1);localStorage.setItem("sales",JSON.stringify(sales));render()}
function render(){
 let r=0,c=0,f=0,p=0; const rows=document.getElementById("rows"); rows.innerHTML="";
 sales.forEach((x,i)=>{r+=x.sale;c+=x.cost;f+=x.fees;p+=x.profit;rows.innerHTML+=`<tr><td>${x.platform}</td><td>${x.sku}</td><td>${tl(x.sale)}</td><td>${tl(x.cost)}</td><td>${tl(x.fees)}</td><td class="${x.profit>=0?'profit':'loss'}">${tl(x.profit)}</td><td><button onclick="del(${i})">Sil</button></td></tr>`});
 revenue.textContent=tl(r);cost.textContent=tl(c);fees.textContent=tl(f);profit.textContent=tl(p);profit.className=p>=0?"profit":"loss";
}
render();
</script>
</body></html>
